service:
  app_id: ipdrev01
  name: IPD评审
  description: >-
    团队级DCP/TR评审插件（新架构）。评审单主体由系统自定义工作项承载：原生工作项详情页 +
    插件自定义Tab呈现评审过程，插件承载评审/审批全过程（会签、决议规则、门禁、不可覆盖快照），TaskEventHandler 守卫流转。
  version: 1.0.5
  mode: org
  logo: null
  language: nodejs
  language_version: 1.11.33
  host_version: 1.11.33
  host_sub_version: 1.11.33
  min_system_version: 6.0.43
  auth: null
  config: null
  scope: 1
  policy:
    policy: standard
    target: ''
  permission:
    - name: IPD 插件管理
      field: ipd_admin
      desc: 允许修改DCP评审模板、阶段、角色、检查项等全局配置
    - name: 新建 IPD 评审
      field: ipd_create_review
      desc: 允许在项目内新建DCP决策评审单
    - name: 查看 IPD 评审总览
      field: ipd_view_review
      desc: 允许查看团队DCP评审总览页面
oauth:
  type:
    - admin
  scope:
    - read:project:issueType
    - read:project:issueStatus
    - read:project:issueField
    - write:project:issue
modules:
  - id: ipd-review-tab
    moduleType: ones:project:component:new
    title: IPD评审
    description: 项目内IPD评审工作台：评审列表、IPD流程图、创建评审单（详情跳转原生工作项详情页）
    entry: ./modules/ipd-review-tab/index.tsx
  - id: ipd-reviewer-workspace
    moduleType: ones:workspace:new
    title: IPD评审工作台
    description: 评审人工作台：查看待评审单、填写评审意见、关联工作项
    entry: modules/ipd-reviewer-workspace/index.html
  - id: ipd-sidebar
    moduleType: ones:app:new
    title: IPD评审
    modules:
      - id: ipd-template-config
        title: 模板配置
        entry: modules/ipd-sidebar/ipd-template-config/index.html
        permission: ipd_admin
      - id: ipd-review-overview
        title: 评审总览
        entry: modules/ipd-sidebar/ipd-review-overview/index.html
        permission: ipd_view_review
  - id: ipd-issue-tab
    title: IPD评审详情
    description: 工作项详情页自定义Tab：评审意见汇总、材料与指标、Checklist、决议快照、轮次对比、审计
    moduleType: ones:issue:tab:new
    modules:
      - id: ipd-issue-tab-content
        name: Tab
        title: 评审过程
        enableMemoryRouter: true
        entry: modules/ipd-issue-tab/tab/index.html
      - id: ipd-issue-tab-preview
        name: Preview
        title: 评审过程预览
        enableMemoryRouter: true
        entry: modules/ipd-issue-tab/preview/index.html
  - id: ipd-quick-action
    title: IPD评审操作
    description: 工作项详情页快捷操作：发起评审、发布决议、催办、开始复审、撤回
    moduleType: ones:global:modal
    entry: modules/ipd-quick-action/index.html
    preload: true
    manual: true
abilities:
  - id: ipd-project-component
    name: ProjectCustomComponent
    version: 1.0.0
    abilityType: ProjectCustomComponent
    function:
      copyPluginData: copyPluginDataForIPD
    relateModule:
      componentModuleEnter: ipd-review-tab
    config:
      - key: component_name
        label: 组件名称
        value: IPD评审
        fieldType: Input
        show: true
      - key: component_desc
        label: 组件描述
        value: IPD决策评审控制台
        fieldType: TextArea
        show: true
      - key: is_support_copy
        label: 支持数据复制
        value: false
        fieldType: Switch
        show: false
  - id: ipd-sidebar-menu
    name: 侧边栏菜单
    version: 1.0.0
    abilityType: SidebarMenu
    relateModule:
      systemMenu: ipd-sidebar
  - id: ipd-issue-tab-ability
    name: IPD评审详情Tab
    version: 1.0.0
    abilityType: LayoutCustomIssueTab
    relateModule:
      moduleID: ipd-issue-tab
  - id: ipd-quick-action-ability
    name: IPD评审快捷操作
    version: 1.0.0
    abilityType: LayoutCustomQuickAction
    relateModule:
      quickActionMenu: ipd-quick-action
  - id: ipd-task-event-handler
    name: 评审单流转守卫
    version: 1.0.0
    abilityType: TaskEventHandler
    function:
      taskPreActionFunc: taskPreAction
      taskActionDoneFunc: taskActionDone
    # 拦截范围不在平台侧声明（值留空 = 平台不过滤事件），由插件按
    # 「工作项映射」配置的类型/字段自行判断；配置入口见侧边栏「模板配置」。
    config:
      - fieldType: Input
        key: issueTypeScope
        show: false
        label: 评审单工作项类型
        value: ''
      - fieldType: Input
        key: field
        show: false
        label: 受保护的工作项属性
        value: ''
